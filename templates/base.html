<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SWGOH reviewer{% endblock %}</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --border: #ddd; --ink: #222;
    --muted: #888; --navy: #1c2541; --link: #4a6fa5;
    --red: #b71c1c; --red-bg: #ffcdd2; --green: #2e7d32; --green-bg: #dcedc8;
    --amber: #f9a825; --amber-bg: #fff8e1;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  header { background: var(--navy); color: #fff; padding: 12px 20px; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 12px; opacity: .9; margin-top: 4px; }
  header .sub a { color: #9db3e0; }
  nav.gnav { display: flex; gap: 18px; background: #fff; border-bottom: 1px solid var(--border); padding: 8px 20px; }
  nav.gnav a { color: var(--link); text-decoration: none; font-size: 13px; padding-bottom: 2px; }
  nav.gnav a.active { font-weight: 700; color: var(--navy); border-bottom: 2px solid var(--navy); }
  main { padding: 16px 20px; max-width: 1100px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
  th, td { border: 1px solid #e2e6ee; padding: 5px 8px; text-align: left; }
  th { background: #f0f2f5; }
  button, input, select { font-size: 13px; padding: 3px 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .card a { margin-right: 12px; }
  .muted { color: var(--muted); }
  .notice { border: 1px solid #bdbdbd; background: #eceff1; border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
  .warnbox { border: 1px solid var(--amber); background: var(--amber-bg); border-radius: 8px; padding: 8px 12px; margin: 10px 0; font-size: 12px; }
  .warnbox ul { margin: 6px 0 0; padding-left: 18px; }
  {% block page_css %}{% endblock %}
</style>
</head>
<body>
<header>
  <h1>{% block page_title %}{% endblock %}</h1>
  <div class="sub">{% block header_sub %}{% endblock %}</div>
</header>
{% if nav %}
<nav class="gnav">
  {% for item in nav %}
  <a href="{{ item.href }}" class="{{ 'active' if item.active }}">{{ item.label }}</a>
  {% endfor %}
</nav>
{% endif %}
<main>
{% block main %}{% endblock %}
</main>
{% block modals %}{% endblock %}
<script src="/static/htmx.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
