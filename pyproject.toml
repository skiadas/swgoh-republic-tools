[project]
name = "swgoh-reviewer"
version = "0.1.0"
description = "Fetch SWGOH player rosters via a local swgoh-comlink service"
requires-python = ">=3.10"
dependencies = [
    "swgoh-comlink>=2.3.0",
    "jsonschema>=4.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
