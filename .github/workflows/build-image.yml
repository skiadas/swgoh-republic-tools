name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          IMG=ghcr.io/skiadas/swgoh-republic-tools
          SHA=$IMG:${{ github.sha }}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=$SHA,$IMG:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$SHA,$IMG:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
